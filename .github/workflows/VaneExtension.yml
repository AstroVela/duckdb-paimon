        run: |
          set -euo pipefail
          # An explicit --index-url must not be supplemented by runner pip configuration.
          for pip_variable in "${!PIP_@}"; do unset "$pip_variable"; done
          export PIP_CONFIG_FILE=/dev/null
          python -m venv .venv-vane-testpypi-ray
          . .venv-vane-testpypi-ray/bin/activate
          python -m pip install --upgrade pip
          mkdir -p indexed
          download_exact() {
            local requirement="$1"
            local index_url="$2"
            for attempt in 1 2 3 4 5; do
              if python -m pip download \
                --disable-pip-version-check \
                --no-cache-dir \
                --no-deps \
                --only-binary=:all: \
                --index-url "$index_url" \
                --dest indexed \
                "$requirement"; then
                return
              fi
              sleep 15
            done
            return 1
          }
          download_exact "vane-ai==$VANE_VERSION" "$RUNTIME_INDEX_URL"
          download_exact "vane-extension-paimon==$PAIMON_VERSION" "$INDEX_URL"

          mapfile -t base_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_ai-*.whl' -print)
          mapfile -t paimon_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_extension_paimon-*.whl' -print)
          mapfile -t expected_paimon < <(find expected/paimon -maxdepth 1 -type f -name '*-cp312-none-manylinux_2_28_x86_64.whl' -print)
          test "${#base_wheels[@]}" -eq 1
          test "${#paimon_wheels[@]}" -eq 1
          test "${#expected_paimon[@]}" -eq 1
          cmp "${expected_paimon[0]}" "${paimon_wheels[0]}"
          python -m pip install "${base_wheels[0]}" "${paimon_wheels[0]}"
          python -m pip check

      - name: Exercise the indexed provider through two Ray workers
        run: .venv-vane-testpypi-ray/bin/python -I test/vane/test_vane_wheel_ray_paimon.py

  publish-pypi-paimon:
    name: Approve and promote the qualified Paimon candidate to PyPI
    if: inputs.operation == 'release'
    needs:
      - assemble-testpypi-paimon
      - testpypi-local-paimon-integration
      - testpypi-ray-paimon-integration
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/vane-extension-paimon
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt

      - name: Read the production Vane source pin
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest vane-extension-release.toml --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source for promotion verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 1
          persist-credentials: false

      - name: Download the unchanged qualified Paimon distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: vane-testpypi-paimon-distributions
          path: dist

      - name: Recheck immutable TestPyPI staging and PyPI availability after approval
        env:
          VANE_VERSION: ${{ needs.assemble-testpypi-paimon.outputs.vane_version }}
        run: |
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py verify-promotion \
            --manifest vane-extension-release.toml --extension-root . \
            --vane-source vane \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml --directory dist \
            --vane-version "$VANE_VERSION"

      - name: Publish the same files through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          packages-dir: dist
          skip-existing: true

      - name: Verify the complete indexed PyPI release
        env:
          PAIMON_VERSION: ${{ needs.assemble-testpypi-paimon.outputs.paimon_version }}
        run: |
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py verify-index \
            --index pypi \
            --manifest vane-extension-release.toml --extension-root . \
            --vane-source vane \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml --directory dist \
            --provider paimon --version "$PAIMON_VERSION"
