name: Vane extension

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Build only, publish development wheels to TestPyPI, or qualify and promote a production release
        type: choice
        options:
          - build-only
          - testpypi-dev
          - release
        default: build-only
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ inputs.operation || 'ci' }}
  cancel-in-progress: ${{ inputs.operation != 'testpypi-dev' && inputs.operation != 'release' }}

permissions:
  contents: read

jobs:
  vane-extension:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    # The called workflow verifies its exact SHA from GitHub job metadata.
    uses: AstroVela/vane-extension-ci-tools/.github/workflows/_vane_extension_ci.yml@618aec05ad68c8c130c69505b1fd99311fc9f47d
    with:
      ci_tools_version: 618aec05ad68c8c130c69505b1fd99311fc9f47d
      manifest: vane-extension.toml
      build_jobs: 12
      run_native_tests: true

  vane-provider-release-tooling:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Validate Paimon provider release tooling
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt "PyYAML>=6.0.2"

      - name: Exercise release validation and secure key consumption
        run: python -I test/vane/test_vane_provider_release.py

  vane-dynamic-wheel:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Build signed Vane dynamic Paimon wheel
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0bf9db09181f36be8cf0628332abb5d31855b7d0f372faa776f492ccd9d3100d
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/vane-extension.toml
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_DYNAMIC_BUILD_DIR: ${{ github.workspace }}/build/vane-dynamic-wheel
      VANE_DYNAMIC_DIST_DIR: ${{ github.workspace }}/build/vane-dynamic-wheel-dist
      VANE_VCPKG_ROOT: ${{ github.workspace }}/vane-vcpkg
      VANE_VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vane/vcpkg_installed
      VANE_BUILD_JOBS: 12
      VANE_CMAKE_COMPILER_LAUNCHER: ccache
      VCPKG_TARGET_TRIPLET: x64-linux
      VCPKG_BINARY_SOURCES: clear
      CCACHE_DIR: ${{ github.workspace }}/.cache/vane-dynamic-wheel-ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout extension and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Select manylinux CPython
        shell: bash
        run: |
          set -euo pipefail
          python_directory=/opt/python/cp312-cp312/bin
          test -x "$python_directory/python"
          echo "$python_directory" >> "$GITHUB_PATH"
          "$python_directory/python" --version

      - name: Read integration manifest
        id: manifest
        run: |
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact Vane and CI-tools identities
        shell: bash
        env:
          VANE_CI_TOOLS_VERSION: 618aec05ad68c8c130c69505b1fd99311fc9f47d
        run: |
          set -euo pipefail
          actual_ci_tools="$(git -C extension/vane-extension-ci-tools rev-parse HEAD)"
          test "$actual_ci_tools" = "$VANE_CI_TOOLS_VERSION"
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            verify-ci-tools \
            --ci-tools-source extension/vane-extension-ci-tools \
            --expected-sha "$VANE_CI_TOOLS_VERSION"
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            identity \
            --vane-source "$VANE_SOURCE_DIR"

      - name: Install native and wheel tooling
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y \
            autoconf \
            automake \
            ccache \
            curl \
            file \
            flex \
            gcc \
            gcc-c++ \
            git \
            libtool \
            m4 \
            make \
            ninja-build \
            openssl \
            openssl-devel \
            patch \
            perl-IPC-Cmd \
            perl-Time-Piece \
            pkgconf-pkg-config \
            tar \
            unzip \
            xz \
            zip
          python -m pip install \
            "auditwheel>=6.4" \
            build \
            "cmake>=3.29" \
            "ninja>=1.10" \
            -r extension/vane-extension-ci-tools/requirements-release.txt \
            "patchelf>=0.17.2" \
            "pybind11[global]>=3.0.0" \
            "scikit-build-core>=0.11.4" \
            "setuptools-scm>=9.2.0"

      - name: Build pinned Bison
        shell: bash
        env:
          BISON_VERSION: 3.8.2
          BISON_SHA256: 9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2
        run: |
          set -euo pipefail
          bison_archive="$RUNNER_TEMP/bison-${BISON_VERSION}.tar.xz"
          bison_source="$RUNNER_TEMP/bison-${BISON_VERSION}"
          bison_prefix="$RUNNER_TEMP/vane-bison-${BISON_VERSION}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location \
              "https://ftp.gnu.org/gnu/bison/bison-${BISON_VERSION}.tar.xz" \
              --output "$bison_archive"; then
              break
            fi
            test "$attempt" -lt 5
            sleep 2
          done
          printf '%s  %s\n' "$BISON_SHA256" "$bison_archive" | sha256sum --check -
          tar -C "$RUNNER_TEMP" -xf "$bison_archive"
          (
            cd "$bison_source"
            ./configure \
              --disable-nls \
              --prefix="$bison_prefix"
            make -j "$VANE_BUILD_JOBS"
            make install
          )
          echo "$bison_prefix/bin" >> "$GITHUB_PATH"
          printf 'VANE_BISON=%s\n' "$bison_prefix/bin/bison" >> "$GITHUB_ENV"
          "$bison_prefix/bin/bison" --version
          "$bison_prefix/bin/bison" --help | grep -F -- '--file-prefix-map'

      - name: Restore dynamic-wheel compiler cache
        id: dynamic_wheel_ccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: vane-paimon-dynamic-wheel-ccache-v2-manylinux_2_28-${{ runner.arch }}-${{ steps.manifest.outputs.vane_revision }}-${{ steps.manifest.outputs.vcpkg_revision }}-${{ hashFiles('extension/vcpkg.json', 'extension/third_party/paimon-cpp/third_party/versions.txt') }}

      - name: Reset dynamic-wheel compiler cache statistics
        run: ccache --zero-stats

      - name: Set up extension vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.manifest.outputs.vcpkg_revision }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Remove verified run-vcpkg state marker
        shell: bash
        env:
          VANE_EXTENSION_VCPKG_REVISION: ${{ steps.manifest.outputs.vcpkg_revision }}
          VANE_EXTENSION_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euo pipefail
          marker="$VANE_EXTENSION_VCPKG_ROOT/vcpkgLastBuiltCommitId"
          test -f "$marker"
          test ! -L "$marker"
          test "$(wc -c < "$marker")" -eq 40
          test "$(<"$marker")" = "$VANE_EXTENSION_VCPKG_REVISION"
          rm -- "$marker"
          vcpkg_status="$(git -C "$VANE_EXTENSION_VCPKG_ROOT" status --porcelain --untracked-files=all)"
          test -z "$vcpkg_status"

      - name: Bootstrap exact Vane dependencies
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: |
          test "$(command -v bison)" = "$VANE_BISON"
          bison --help | grep -F -- '--file-prefix-map'
          make -f extension/vane-extension-ci-tools/makefiles/vane_extension.Makefile \
            vane_wheel_dependencies \
            VANE_EXTENSION_ROOT="$VANE_EXTENSION_ROOT" \
            VANE_MANIFEST="$VANE_MANIFEST" \
            VANE_SOURCE_DIR="$VANE_SOURCE_DIR" \
            VANE_VCPKG_ROOT="$VANE_VCPKG_ROOT" \
            VANE_VCPKG_INSTALLED_DIR="$VANE_VCPKG_INSTALLED_DIR" \
            VANE_BUILD_JOBS="$VANE_BUILD_JOBS"

      - name: Build and verify dynamic provider wheel
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_MAX_CONCURRENCY: ${{ env.VANE_BUILD_JOBS }}
        run: |
          python -I extension/scripts/build_vane_dynamic_wheel.py \
            --extension-root "$VANE_EXTENSION_ROOT" \
            --vane-source "$VANE_SOURCE_DIR" \
            --vane-revision "${{ steps.manifest.outputs.vane_revision }}" \
            --vane-vcpkg-installed "$VANE_VCPKG_INSTALLED_DIR" \
            --vcpkg-toolchain "$VCPKG_TOOLCHAIN_PATH" \
            --build-directory "$VANE_DYNAMIC_BUILD_DIR" \
            --output-directory "$VANE_DYNAMIC_DIST_DIR" \
            --jobs "$VANE_BUILD_JOBS" \
            --signing-profile ci-test \
            --signing-private-key "$VANE_SOURCE_DIR/external/duckdb/test/mbedtls/private.pem" \
            --package-local-runtime

      - name: Report dynamic-wheel compiler cache
        if: always()
        shell: bash
        env:
          VANE_CCACHE_ACTION_HIT: ${{ steps.dynamic_wheel_ccache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'GitHub Actions ccache restore hit: %s\n' "${VANE_CCACHE_ACTION_HIT:-false}"
          ccache --show-stats

      - name: Upload CI-only dynamic wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-paimon-dynamic-wheels
          path: ${{ env.VANE_DYNAMIC_DIST_DIR }}/*.whl
          if-no-files-found: error
          retention-days: 1

  vane-wheel-paimon-integration:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Vane dynamic wheel local Paimon integration
    needs: vane-dynamic-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VANE_RUNNER: local-fast
      VANE_EXPECTED_EXTENSION_TRUST_IDENTITY: vane-ci-test-key

    steps:
      - name: Checkout extension
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified dynamic wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: vane-paimon-dynamic-wheels
          path: vane-wheels

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Exercise Paimon through the packaged provider wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-vane-wheel-integration
          . .venv-vane-wheel-integration/bin/activate
          mapfile -t base_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_ai-*.whl' -print | sort)
          mapfile -t paimon_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_extension_paimon-*.whl' -print | sort)
          test "${#base_wheels[@]}" -eq 1
          test "${#paimon_wheels[@]}" -eq 1
          python -m pip install --disable-pip-version-check \
            "${base_wheels[0]}" "${paimon_wheels[0]}"
          python -I test/vane/test_vane_wheel_paimon.py

  vane-wheel-ray-paimon-integration:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Vane dynamic wheel two-worker Ray Paimon integration
    needs: vane-dynamic-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      VANE_RUNNER: ray
      VANE_EXPECTED_EXTENSION_TRUST_IDENTITY: vane-ci-test-key
      RAY_DEDUP_LOGS: "0"
      VANE_UDF_TARGET_MAX_BATCH_BYTES: "4096"

    steps:
      - name: Checkout extension
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified dynamic wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: vane-paimon-dynamic-wheels
          path: vane-wheels

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Exercise Paimon through two Ray workers
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-vane-wheel-ray-integration
          . .venv-vane-wheel-ray-integration/bin/activate
          mapfile -t base_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_ai-*.whl' -print | sort)
          mapfile -t paimon_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_extension_paimon-*.whl' -print | sort)
          test "${#base_wheels[@]}" -eq 1
          test "${#paimon_wheels[@]}" -eq 1
          python -m pip install --disable-pip-version-check \
            "${base_wheels[0]}" "${paimon_wheels[0]}"
          python -I test/vane/test_vane_wheel_ray_paimon.py

  vane-release-preflight:
    name: Validate the publishing context and exact Vane release
    if: inputs.operation == 'testpypi-dev' || inputs.operation == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      vane_version: ${{ steps.preflight.outputs.vane_version }}
    env:
      VANE_RELEASE_MANIFEST: ${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}
    steps:
      - name: Require the protected publishing branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = AstroVela/duckdb-paimon
          test "$GITHUB_REF" = refs/heads/main_vane
          test "$GITHUB_REF_PROTECTED" = true

      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install preflight tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt "setuptools-scm>=9.2.0"

      - name: Read the committed Vane source pin
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source and version history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Reject an unavailable production release before signing or building
        id: preflight
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: |
          python -I scripts/vane_release_preflight.py \
            --operation "$RELEASE_OPERATION" \
            --vane-source "$GITHUB_WORKSPACE/vane" \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --github-output "$GITHUB_OUTPUT"

  vane-testpypi-wheels:
    needs: vane-release-preflight
    if: inputs.operation == 'testpypi-dev' || inputs.operation == 'release'
    name: Build signed Paimon provider candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment:
      name: ${{ inputs.operation == 'release' && 'production-signing' || 'testpypi' }}
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0bf9db09181f36be8cf0628332abb5d31855b7d0f372faa776f492ccd9d3100d
    permissions:
      contents: read
    outputs:
      vane_version: ${{ steps.release.outputs.vane_version }}
      paimon_version: ${{ steps.release.outputs.paimon_version }}
    env:
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_DYNAMIC_BUILD_DIR: ${{ github.workspace }}/build/vane-testpypi-wheel
      VANE_DYNAMIC_DIST_DIR: ${{ github.workspace }}/build/vane-testpypi-wheel-dist
      VANE_RUNTIME_WHEEL_DIR: ${{ github.workspace }}/build/vane-testpypi-runtime-wheels
      VANE_VCPKG_ROOT: ${{ github.workspace }}/vane-vcpkg
      VANE_VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vane/vcpkg_installed
      VANE_PYTHON: /opt/python/cp312-cp312/bin/python
      VANE_BUILD_JOBS: 16
      VANE_CMAKE_COMPILER_LAUNCHER: ccache
      VCPKG_TARGET_TRIPLET: x64-linux
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-archives
      CCACHE_DIR: ${{ github.workspace }}/.cache/vane-testpypi-wheel-ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Require the protected release branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main_vane
          test "$GITHUB_REPOSITORY" = AstroVela/duckdb-paimon
          test "$GITHUB_REF_PROTECTED" = true

      - name: Checkout extension and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Read integration manifest
        id: manifest
        shell: bash
        run: |
          "$VANE_PYTHON" extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Download every exact indexed Vane runtime wheel
        id: vane_candidate
        shell: bash
        env:
          INDEX_URL: ${{ inputs.operation == 'release' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
          VANE_VERSION: ${{ needs.vane-release-preflight.outputs.vane_version }}
        run: |
          set -euo pipefail
          # An explicit --index-url must not be supplemented by runner pip configuration.
          for pip_variable in "${!PIP_@}"; do unset "$pip_variable"; done
          export PIP_CONFIG_FILE=/dev/null
          version="$VANE_VERSION"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p "$VANE_RUNTIME_WHEEL_DIR"
          for runtime in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
            interpreter="/opt/python/$runtime/bin/python"
            destination="$VANE_RUNTIME_WHEEL_DIR/$runtime"
            mkdir -p "$destination"
            "$interpreter" -m pip download \
              --disable-pip-version-check \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url "$INDEX_URL" \
              --dest "$destination" \
              "vane-ai==$version"
            test "$(find "$destination" -maxdepth 1 -type f -name 'vane_ai-*.whl' | wc -l)" -eq 1
          done

      - name: Install native and wheel tooling
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y \
            autoconf \
            automake \
            ccache \
            curl \
            file \
            flex \
            gcc \
            gcc-c++ \
            git \
            libtool \
            m4 \
            make \
            ninja-build \
            openssl \
            openssl-devel \
            patch \
            perl-IPC-Cmd \
            perl-Time-Piece \
            pkgconf-pkg-config \
            tar \
            unzip \
            xz \
            zip
          "$VANE_PYTHON" -m pip install \
            "auditwheel>=6.4" \
            build \
            "cmake>=3.29" \
            "ninja>=1.10" \
            -r extension/vane-extension-ci-tools/requirements-release.txt \
            "patchelf>=0.17.2" \
            "pybind11[global]>=3.0.0" \
            "scikit-build-core>=0.11.4" \
            "setuptools-scm>=9.2.0"
          echo "$(dirname "$VANE_PYTHON")" >> "$GITHUB_PATH"

      - name: Build pinned Bison
        shell: bash
        env:
          BISON_VERSION: 3.8.2
          BISON_SHA256: 9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2
        run: |
          set -euo pipefail
          bison_archive="$RUNNER_TEMP/bison-${BISON_VERSION}.tar.xz"
          bison_source="$RUNNER_TEMP/bison-${BISON_VERSION}"
          bison_prefix="$RUNNER_TEMP/vane-bison-${BISON_VERSION}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location \
              "https://ftp.gnu.org/gnu/bison/bison-${BISON_VERSION}.tar.xz" \
              --output "$bison_archive"; then
              break
            fi
            test "$attempt" -lt 5
            sleep 2
          done
          printf '%s  %s\n' "$BISON_SHA256" "$bison_archive" | sha256sum --check -
          tar -C "$RUNNER_TEMP" -xf "$bison_archive"
          (
            cd "$bison_source"
            ./configure \
              --disable-nls \
              --prefix="$bison_prefix"
            make -j "$VANE_BUILD_JOBS"
            make install
          )
          echo "$bison_prefix/bin" >> "$GITHUB_PATH"
          printf 'VANE_BISON=%s\n' "$bison_prefix/bin/bison" >> "$GITHUB_ENV"
          "$bison_prefix/bin/bison" --version
          "$bison_prefix/bin/bison" --help | grep -F -- '--file-prefix-map'

      - name: Validate exact Vane and CI-tools identities
        shell: bash
        env:
          VANE_CI_TOOLS_VERSION: 618aec05ad68c8c130c69505b1fd99311fc9f47d
        run: |
          set -euo pipefail
          actual_ci_tools="$(git -C extension/vane-extension-ci-tools rev-parse HEAD)"
          test "$actual_ci_tools" = "$VANE_CI_TOOLS_VERSION"
          "$VANE_PYTHON" extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            verify-ci-tools \
            --ci-tools-source extension/vane-extension-ci-tools \
            --expected-sha "$VANE_CI_TOOLS_VERSION"
          "$VANE_PYTHON" extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            identity \
            --vane-source "$VANE_SOURCE_DIR"

      - name: Restore compiler and package caches
        id: testpypi_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vane-paimon-testpypi-wheel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.manifest.outputs.vane_revision }}-${{ steps.manifest.outputs.vcpkg_revision }}-${{ hashFiles('extension/vcpkg.json', 'extension/third_party/paimon-cpp/third_party/versions.txt') }}

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Set up extension vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.manifest.outputs.vcpkg_revision }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Remove verified run-vcpkg state marker
        shell: bash
        env:
          VANE_EXTENSION_VCPKG_REVISION: ${{ steps.manifest.outputs.vcpkg_revision }}
          VANE_EXTENSION_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euo pipefail
          marker="$VANE_EXTENSION_VCPKG_ROOT/vcpkgLastBuiltCommitId"
          test -f "$marker"
          test ! -L "$marker"
          test "$(wc -c < "$marker")" -eq 40
          test "$(<"$marker")" = "$VANE_EXTENSION_VCPKG_REVISION"
          rm -- "$marker"
          vcpkg_status="$(git -C "$VANE_EXTENSION_VCPKG_ROOT" status --porcelain --untracked-files=all)"
          test -z "$vcpkg_status"

      - name: Bootstrap exact Vane dependencies
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VANE_BOOTSTRAP_PYTHON: ${{ env.VANE_PYTHON }}
        run: |
          set -euo pipefail
          test "$(command -v bison)" = "$VANE_BISON"
          bison --help | grep -F -- '--file-prefix-map'
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          make -f extension/vane-extension-ci-tools/makefiles/vane_extension.Makefile \
            vane_wheel_dependencies \
            VANE_EXTENSION_ROOT="$VANE_EXTENSION_ROOT" \
            VANE_MANIFEST="$VANE_MANIFEST" \
            VANE_SOURCE_DIR="$VANE_SOURCE_DIR" \
            VANE_VCPKG_ROOT="$VANE_VCPKG_ROOT" \
            VANE_VCPKG_INSTALLED_DIR="$VANE_VCPKG_INSTALLED_DIR" \
            VANE_BUILD_JOBS="$VANE_BUILD_JOBS" \
            VANE_PYTHON="$VANE_PYTHON"

      - name: Build, sign and verify the Paimon provider wheel matrix
        shell: bash
        env:
          VANE_SELECTED_SIGNING_PRIVATE_KEY: ${{ secrets[inputs.operation == 'release' && 'VANE_EXTENSION_SIGNING_PRIVATE_KEY' || 'VANE_TESTPYPI_EXTENSION_SIGNING_PRIVATE_KEY'] }}
          VANE_SIGNING_PROFILE: ${{ inputs.operation == 'release' && 'production' || 'testpypi' }}
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_MAX_CONCURRENCY: ${{ env.VANE_BUILD_JOBS }}
        run: |
          set -euo pipefail
          test -n "$VANE_SELECTED_SIGNING_PRIVATE_KEY"
          signing_key="$RUNNER_TEMP/vane-testpypi-extension-signing.pem"
          cleanup() {
            shred --force --remove "$signing_key" 2>/dev/null || true
          }
          trap cleanup EXIT
          umask 077
          printf '%s' "$VANE_SELECTED_SIGNING_PRIVATE_KEY" > "$signing_key"
          unset VANE_SELECTED_SIGNING_PRIVATE_KEY

          runtime_arguments=()
          for runtime in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
            interpreter="/opt/python/$runtime/bin/python"
            mapfile -t wheels < <(find "$VANE_RUNTIME_WHEEL_DIR/$runtime" -maxdepth 1 -type f -name 'vane_ai-*.whl' -print)
            test "${#wheels[@]}" -eq 1
            runtime_arguments+=(--runtime-python "$interpreter" --runtime-wheel "${wheels[0]}")
          done

          "$VANE_PYTHON" -I extension/scripts/build_vane_dynamic_wheel.py \
            --extension-root "$VANE_EXTENSION_ROOT" \
            --vane-source "$VANE_SOURCE_DIR" \
            --vane-revision "${{ steps.manifest.outputs.vane_revision }}" \
            --vane-vcpkg-installed "$VANE_VCPKG_INSTALLED_DIR" \
            --vcpkg-toolchain "$VCPKG_TOOLCHAIN_PATH" \
            --build-directory "$VANE_DYNAMIC_BUILD_DIR" \
            --output-directory "$VANE_DYNAMIC_DIST_DIR" \
            --jobs "$VANE_BUILD_JOBS" \
            --signing-profile "$VANE_SIGNING_PROFILE" \
            --signing-private-key "$signing_key" \
            --consume-signing-private-key \
            "${runtime_arguments[@]}"

      - name: Validate the immutable publishable release set
        id: release
        shell: bash
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          publish_arguments=(--require-publishable-on testpypi)
          if test "$RELEASE_OPERATION" = release; then
            publish_arguments+=(--require-publishable-on pypi)
          fi
          "$VANE_PYTHON" -I extension/vane-extension-ci-tools/scripts/vane_provider_release.py validate \
            --manifest "$VANE_MANIFEST" --extension-root "$VANE_EXTENSION_ROOT" \
            --vane-source "$VANE_SOURCE_DIR" \
            --ci-tools-version "$(git -C "$VANE_EXTENSION_ROOT" rev-parse HEAD:vane-extension-ci-tools)" \
            --config extension/vane-provider-release.toml \
            --directory "$VANE_DYNAMIC_DIST_DIR" \
            --vane-version "${{ steps.vane_candidate.outputs.version }}" \
            --channel "$RELEASE_OPERATION" \
            "${publish_arguments[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report compiler cache
        if: always()
        shell: bash
        env:
          VANE_CACHE_ACTION_HIT: ${{ steps.testpypi_cache.outputs.cache-hit }}
        run: |
          printf 'GitHub Actions cache restore hit: %s\n' "${VANE_CACHE_ACTION_HIT:-false}"
          ccache --show-stats

      - name: Upload verified Paimon provider wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-testpypi-paimon-wheels
          path: ${{ env.VANE_DYNAMIC_DIST_DIR }}/*.whl
          if-no-files-found: error
          retention-days: 30

  assemble-testpypi-paimon:
    name: Validate, attest and sign TestPyPI Paimon provider
    needs: vane-testpypi-wheels
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      VANE_RELEASE_MANIFEST: ${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}
      RELEASE_OPERATION: ${{ inputs.operation }}
    outputs:
      vane_version: ${{ needs.vane-testpypi-wheels.outputs.vane_version }}
      paimon_version: ${{ needs.vane-testpypi-wheels.outputs.paimon_version }}

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt

      - name: Read exact Vane source pin
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source for release verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 1
          persist-credentials: false

      - name: Download Paimon provider wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: vane-testpypi-paimon-wheels
          path: packages

      - name: Revalidate the complete release set
        run: |
          set -euo pipefail
          publish_arguments=(--require-publishable-on testpypi)
          if test "$RELEASE_OPERATION" = release; then
            publish_arguments+=(--require-publishable-on pypi)
          fi
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py validate \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            --vane-source vane \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml \
            --directory packages \
            --vane-version "${{ needs.vane-testpypi-wheels.outputs.vane_version }}" \
            --channel "$RELEASE_OPERATION" \
            "${publish_arguments[@]}"

      - name: Assemble distributions and checksums
        run: |
          mkdir -p distributions release-assets
          cp packages/vane_extension_paimon-*.whl distributions/
          (cd packages && sha256sum *.whl) > release-assets/SHA256SUMS

      - name: Generate a CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: packages
          format: cyclonedx-json
          output-file: release-assets/vane-extension-paimon-sbom.cdx.json
          upload-artifact: false

      - name: Attest provider provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/packages/*

      - name: Preserve the provenance bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            release-assets/vane-extension-paimon-build-provenance.sigstore.json

      - name: Sign provider distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: packages/*.whl

      - name: Upload Paimon distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-testpypi-paimon-distributions
          path: distributions/*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-testpypi-paimon-supplemental
          path: |
            release-assets/*
            packages/*.sigstore.json
          if-no-files-found: error
          retention-days: 30

  publish-testpypi-paimon:
    name: Publish Paimon provider to TestPyPI
    needs: assemble-testpypi-paimon
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vane-extension-paimon
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Paimon distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: vane-testpypi-paimon-distributions
          path: dist

      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi-paimon:
    name: Verify indexed Paimon provider
    needs: [assemble-testpypi-paimon, publish-testpypi-paimon]
    runs-on: ubuntu-24.04
    env:
      VANE_RELEASE_MANIFEST: ${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}
    permissions:
      contents: read

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt

      - name: Read exact Vane source pin
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source for release verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 1
          persist-credentials: false

      - name: Download Paimon distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: vane-testpypi-paimon-distributions
          path: dist

      - name: Compare the immutable indexed release
        run: |
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py verify-index \
            --index testpypi \
            --manifest "$VANE_RELEASE_MANIFEST" --extension-root . \
            --vane-source vane \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml \
            --provider paimon \
            --directory dist \
            --version "${{ needs.assemble-testpypi-paimon.outputs.paimon_version }}"

  testpypi-local-paimon-integration:
    name: TestPyPI local Paimon integration
    needs: [assemble-testpypi-paimon, verify-testpypi-paimon]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VANE_RUNNER: local-fast
      VANE_EXPECTED_EXTENSION_TRUST_IDENTITY: ${{ inputs.operation == 'release' && 'astrovela/vane' || 'astrovela/vane-testpypi' }}
      INDEX_URL: https://test.pypi.org/simple/
      RUNTIME_INDEX_URL: ${{ inputs.operation == 'release' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}

    steps:
      - name: Checkout extension tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download expected Paimon distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: vane-testpypi-paimon-distributions
          path: expected/paimon

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the exact indexed package graph
        shell: bash
        env:
          VANE_VERSION: ${{ needs.assemble-testpypi-paimon.outputs.vane_version }}
          PAIMON_VERSION: ${{ needs.assemble-testpypi-paimon.outputs.paimon_version }}
        run: |
          set -euo pipefail
          # An explicit --index-url must not be supplemented by runner pip configuration.
          for pip_variable in "${!PIP_@}"; do unset "$pip_variable"; done
          export PIP_CONFIG_FILE=/dev/null
          python -m venv .venv-vane-testpypi-local
          . .venv-vane-testpypi-local/bin/activate
          python -m pip install --upgrade pip
          mkdir -p indexed
          download_exact() {
            local requirement="$1"
            local index_url="$2"
            for attempt in 1 2 3 4 5; do
              if python -m pip download \
                --disable-pip-version-check \
                --no-cache-dir \
                --no-deps \
                --only-binary=:all: \
                --index-url "$index_url" \
                --dest indexed \
                "$requirement"; then
                return
              fi
              sleep 15
            done
            return 1
          }
          download_exact "vane-ai==$VANE_VERSION" "$RUNTIME_INDEX_URL"
          download_exact "vane-extension-paimon==$PAIMON_VERSION" "$INDEX_URL"

          mapfile -t base_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_ai-*.whl' -print)
          mapfile -t paimon_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_extension_paimon-*.whl' -print)
          mapfile -t expected_paimon < <(find expected/paimon -maxdepth 1 -type f -name '*-cp312-none-manylinux_2_28_x86_64.whl' -print)
          test "${#base_wheels[@]}" -eq 1
          test "${#paimon_wheels[@]}" -eq 1
          test "${#expected_paimon[@]}" -eq 1
          cmp "${expected_paimon[0]}" "${paimon_wheels[0]}"
          python -m pip install "${base_wheels[0]}" "${paimon_wheels[0]}"
          python -m pip check

      - name: Exercise the indexed provider locally
        run: .venv-vane-testpypi-local/bin/python -I test/vane/test_vane_wheel_paimon.py

  testpypi-ray-paimon-integration:
